      file:
        path: "{{ target_home }}/.local/share/{{ target_user }}-ansible/{{ item }}"
        state: directory
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: '0755'
      loop: "{{ target_user_ansible_folders }}"

