- name: Setup Yoga Akai Neko
  hosts: hosts
  become: yes
  vars_files:
    - .env.yaml

  vars:
    target_user_ansible_folders:
      - markers
      - cache/github-releases

    first_citizen_files:
      - src: assets/files/etc/dnf/dnf.conf
        dest: /etc/dnf/dnf.conf
        mode: '0644'
        owner: root
        group: root

    snap_packages:
      - obsidian
      - onlyoffice-desktopeditors
      - freecad

    flatpak_packages:
      - com.google.AndroidStudio
      - dev.vencord.Vesktop # Extendable Discord
      - org.gnome.baobab
      - io.missioncenter.MissionCenter
      - org.vinegarhq.Sober # Roblox

    copr_repos:
      - atim/bottom
      - lihaohong/scc
      - zeno/scrcpy
      - wojnilowicz/ungoogled-chromium

    yum_repos:
      fedora-cisco-openh264:
        - fedora-cisco-openh264

    rpm_urls:
      - "https://prerelease.keybase.io/keybase_amd64.rpm"
      - "https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm"
      - "https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm"
      - "https://repo.linrunner.de/fedora/tlp/repos/releases/tlp-release.fc{{ ansible_facts['distribution_major_version'] }}.noarch.rpm"

    github_rpm_packages:
      - name: rustdesk
        repo: rustdesk/rustdesk
      - name: youtube-music
        repo: th-ch/youtube-music
      - name: yaak-app
        repo: mountain-loop/yaak

    dnf_exclude_packages:
      - lame-devel
      - gstreamer1-plugins-bad-free-devel

    dnf_packages:
      - adwaita-icon-theme
      - ansible-core
      - aria2
      - bottom
      - btrfs-assistant
      - cloudflared
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
      - kicad
      - lm_sensors
      - dnf5-plugin-automatic
      - pcp
      - python3-pcp
      - pcp-selinux
      - code
      - curl
      - dnf-plugins-core
      - easyeffects
      - lsp-plugins
      - fastfetch
      - feh
      - flameshot
      - fonts-tweak-tool
      - gcolor3
      - gnome-boxes
      - qemu
      - virt-install
      - virt-viewer
      - gnome-keyring
      - gnome-tweaks
      - gimp
      - gparted
      - gstreamer1-plugins-base
      - gstreamer1-plugins-bad-free
      - gstreamer1-plugin-dav1d
      - gstreamer1-plugins-good
      - gstreamer1-plugins-ugly-free
      - gstreamer1-libav
      - gstreamer1-plugin-openh264
      - libavcodec-freeworld
      - gtk-murrine-engine
      - gvfs-mtp
      - java-latest-openjdk
      - just
      - keepassxc
      - mpv
      - nmap
      - nodejs
      - obs-studio
      - openrgb
      - parallel
      - pipx
      - playerctl
      - rclone
      - rust
      - cargo
      - scrcpy
      - samba
      - samba-winbind-clients
      - screen
      - scc
      - seahorse
      - speech-dispatcher
      - syncthing
      - thonny
      - thunar
      - thunar-archive-plugin
      - file-roller
      - ifuse
      - libimobiledevice
      - gvfs-afc
      - tlp
      - tlp-rdw
      - ufw
      - ungoogled-chromium
      - xbindkeys
      - xclip
      - wget
      - zbar

    shell_scripts_install:
      - name: "uv"
        url: "https://astral.sh/uv/install.sh"
        shell: "sh"

